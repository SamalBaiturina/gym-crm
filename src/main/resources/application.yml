# Settings common to all environments. The database settings are in application-<profile>.yml.
spring:
  application:
    name: gym-crm
  # the profile used when none is selected
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    # services map entities to domain objects inside a transaction, no lazy loading in controllers
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        # only what is needed, every other Actuator endpoint stays closed
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Gym CRM System
    description: Trainees, trainers and their trainings
